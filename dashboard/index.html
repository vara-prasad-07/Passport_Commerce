<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Passport Commerce — a signed, machine-readable trust layer that lets AI buyer agents verify a merchant and transact safely. Merchant Passport + MarginMind." />
    <meta name="theme-color" content="#08090c" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f4b740'/%3E%3Cpath d='M16 6l8 3.6v6.2c0 4.6-3.2 8.6-8 10.2-4.8-1.6-8-5.6-8-10.2V9.6z' fill='%230b0c10'/%3E%3Cpath d='M12.4 16.2l2.6 2.6 5-5.2' stroke='%23f4b740' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Passport Commerce — The trust layer for agentic commerce</title>
    <script>
      // Applied before first paint so the chosen theme never flashes.
      try {
        var t = localStorage.getItem("pc-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
